# rosbag2 mcap storage options for `ros2 bag record --storage-config-file`.
# Per-chunk zstd: the sem_map image outputs compress ~4x, and Foxglove reads
# chunk compression natively (rosbag2's --compression-mode wraps whole files).
compression: "Zstd"
compressionLevel: "Default"
